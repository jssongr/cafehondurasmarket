<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="NexCarg conecta empresas que necesitan mover mercancía con transportistas verificados de Panamá, Costa Rica, Nicaragua, Honduras, El Salvador y Guatemala. Contrato digital, pago en garantía, GPS en vivo y prueba de entrega.">
  <meta name="theme-color" content="#0F1F29">

  <!-- Tarjeta que se ve al compartir el enlace en WhatsApp, Facebook o LinkedIn.
       Sin esto el anuncio aparece como un enlace pelado y casi nadie lo abre. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="NexCarg">
  <meta property="og:locale" content="es_HN">
  <meta property="og:url" content="https://nexcarg.com">
  <meta property="og:title" content="NexCarg — Transporte de carga terrestre en Centroamérica">
  <meta property="og:description" content="Publicá tu carga, recibí ofertas de transportistas verificados, firmá un contrato digital y pagá solo cuando la entrega esté probada.">
  <meta property="og:image" content="https://nexcarg.com/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="NexCarg — Transporte de carga terrestre en Centroamérica">
  <meta name="twitter:description" content="Publicá tu carga, recibí ofertas de transportistas verificados, firmá un contrato digital y pagá solo cuando la entrega esté probada.">
  <meta name="twitter:image" content="https://nexcarg.com/og.png">

  <!-- Para los buscadores. La app dibuja todo en un canvas, así que de esta
       página no hay texto que indexar: lo que se indexa son /transportistas.html
       y /empresas.html, y esto le dice a Google que existen y de quién son. -->
  <link rel="canonical" href="https://nexcarg.com/">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "NexCarg",
    "url": "https://nexcarg.com",
    "logo": "https://nexcarg.com/icons/Icon-192.png",
    "description": "Plataforma de transporte de carga terrestre que conecta empresas con transportistas verificados en Panamá, Costa Rica, Nicaragua, Honduras, El Salvador y Guatemala.",
    "areaServed": ["PA", "CR", "NI", "HN", "SV", "GT"],
    "email": "soporte@nexcarg.com",
    "sameAs": [
      "https://nexcarg.com/transportistas.html",
      "https://nexcarg.com/empresas.html"
    ]
  }
  </script>

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="NexCarg">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>NexCarg — Transporte de carga terrestre en Centroamérica</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #0F1F29; }
    /* Pantalla de arranque. La app pesa unos megabytes y hasta que carga la
       página quedaba en blanco: quien llega desde un anuncio con datos móviles
       cree que el sitio está caído y se va antes de ver nada. */
    #arranque {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 26px;
      background: linear-gradient(135deg, #0F1F29 0%, #1E3A52 60%, #2C5468 100%);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      transition: opacity .35s ease; z-index: 9999;
    }
    #arranque img { width: 190px; max-width: 55vw; }
    #arranque .barra {
      width: 190px; max-width: 55vw; height: 3px; border-radius: 999px;
      background: rgba(255,255,255,.14); overflow: hidden;
    }
    #arranque .barra i {
      display: block; width: 40%; height: 100%; border-radius: 999px;
      background: #5470FF; animation: corre 1.1s ease-in-out infinite;
    }
    @keyframes corre {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(250%); }
    }
    #arranque p { margin: 0; color: rgba(255,255,255,.55); font-size: 13px; }
  </style>
</head>
<body>
  <div id="arranque">
    <img src="icons/Icon-192.png" alt="NexCarg" style="width:76px;border-radius:20px">
    <div class="barra"><i></i></div>
    <p>Cargando NexCarg…</p>
  </div>
  <!-- Quien llegue sin JavaScript —o con una conexión que no aguantó la
       descarga— igual tiene a dónde ir en vez de una pantalla negra. -->
  <noscript>
    <div style="position:fixed;inset:0;z-index:10000;background:#0F1F29;color:#fff;
                font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
                padding:40px 24px;overflow:auto">
      <div style="max-width:620px;margin:0 auto">
        <h1 style="font-size:28px;line-height:1.25;margin:0 0 14px">NexCarg — transporte de carga terrestre en Centroamérica</h1>
        <p style="font-size:16px;line-height:1.6;color:rgba(255,255,255,.8)">
          Conectamos empresas que necesitan mover mercancía con transportistas
          verificados en Panamá, Costa Rica, Nicaragua, Honduras, El Salvador y
          Guatemala. Contrato digital, pago retenido hasta la entrega probada,
          seguimiento GPS y comisión del 5% solo cuando el viaje se completa.
        </p>
        <p style="font-size:16px;line-height:1.6;color:rgba(255,255,255,.8)">
          La aplicación necesita JavaScript. Mientras tanto podés leer cómo
          funciona:
        </p>
        <p style="font-size:16px;line-height:2">
          <a href="/transportistas.html" style="color:#8fb4d8">Para transportistas</a> ·
          <a href="/empresas.html" style="color:#8fb4d8">Para empresas</a> ·
          <a href="/terminos.html" style="color:#8fb4d8">Términos de uso</a> ·
          <a href="/privacidad.html" style="color:#8fb4d8">Política de privacidad</a>
        </p>
        <p style="font-size:14px;color:rgba(255,255,255,.55)">soporte@nexcarg.com</p>
      </div>
    </div>
  </noscript>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
